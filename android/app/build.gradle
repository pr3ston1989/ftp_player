plugins { id 'com.android.application' }
android {
    namespace 'pl.ftpplayer'
    compileSdk 35
    defaultConfig {
        applicationId 'pl.ftpplayer'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '1.1.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        if (project.hasProperty('testEmulator')) {
            ndk { abiFilters.clear(); abiFilters 'x86_64' }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    signingConfigs {
        release {
            storeFile file(System.getenv('FTP_PLAYER_KEYSTORE') ?: '../../signing/release.jks')
            storePassword System.getenv('FTP_PLAYER_STORE_PASSWORD') ?: 'ftp-player-local'
            keyAlias 'ftpplayer'
            keyPassword System.getenv('FTP_PLAYER_KEY_PASSWORD') ?: 'ftp-player-local'
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
        debug {
            if (file(System.getenv('FTP_PLAYER_KEYSTORE') ?: '../../signing/release.jks').isFile()) {
                signingConfig signingConfigs.release
            }
        }
    }
    packaging { jniLibs { excludes += ['**/x86/**', '**/x86_64/**'] } }
}
dependencies {
    implementation 'org.videolan.android:libvlc-all:3.6.5'
    implementation 'commons-net:commons-net:3.13.0'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'junit:junit:4.13.2'
}
