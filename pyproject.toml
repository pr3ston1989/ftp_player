[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ftp-player"
version = "1.1.0"
description = "Private media browser for FTP, FTPS and HTTPS servers"
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "Pillow>=10", "mpv>=1.0", "pillow-heif>=0.18"]

[project.gui-scripts]
ftp-player = "ftp_player.__main__:main"

[tool.setuptools.packages.find]
include = ["ftp_player*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
